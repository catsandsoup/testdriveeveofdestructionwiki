<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="100%" stop-color="#0a0c0e"/>
    </linearGradient>
    <linearGradient id="redPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#8e0000"/>
    </linearGradient>
    <linearGradient id="yellowSpray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffee55"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
  </defs>

  <!-- Chamfered plate background -->
  <polygon points="8,2 56,2 62,8 62,56 56,62 8,62 2,56 2,8" fill="url(#bgGrad)" stroke="#3a4250" stroke-width="2"/>
  
  <!-- Subtle corner rivets -->
  <circle cx="7" cy="7" r="1.5" fill="#a0aec0"/>
  <circle cx="57" cy="7" r="1.5" fill="#a0aec0"/>
  <circle cx="7" cy="57" r="1.5" fill="#a0aec0"/>
  <circle cx="57" cy="57" r="1.5" fill="#a0aec0"/>

  <!-- Red oval badge -->
  <ellipse cx="32" cy="22" rx="26" ry="11" fill="url(#redPill)" stroke="#ff4d4d" stroke-width="1" transform="rotate(-6, 32, 22)"/>
  <text x="32" y="26" font-family="'Impact', 'Arial Black', sans-serif" font-size="10" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="0.5" transform="rotate(-6, 32, 22)">TD</text>

  <!-- Acid yellow spray letters: EOD -->
  <text x="33" y="52" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" font-weight="900" font-style="italic" fill="#000000" text-anchor="middle" transform="skewX(-8)">EOD</text>
  <text x="31" y="50" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" font-weight="900" font-style="italic" fill="url(#yellowSpray)" stroke="#d48800" stroke-width="0.8" text-anchor="middle" transform="skewX(-8)">EOD</text>

  <!-- Bottom hazard bar -->
  <rect x="12" y="56" width="40" height="3" fill="#ffcc00" rx="1"/>
</svg>
