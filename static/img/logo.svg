<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Metal gradient -->
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="50%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#0a0c0e"/>
    </linearGradient>
    
    <!-- Red oval gradient -->
    <linearGradient id="redBadge" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#d32f2f"/>
      <stop offset="50%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#7f0000"/>
    </linearGradient>

    <!-- Yellow spray gradient -->
    <linearGradient id="yellowSpray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffee55"/>
      <stop offset="60%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <!-- Hazard stripe pattern -->
    <pattern id="hazardStripe" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#f5a623" stroke-width="10" />
      <line x1="10" y1="0" x2="10" y2="20" stroke="#16181d" stroke-width="10" />
    </pattern>

    <!-- Drop shadow -->
    <filter id="grungeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Base Plate with Chamfered Corners -->
  <polygon points="12,0 508,0 520,12 520,108 508,120 12,120 0,108 0,12" fill="url(#metalPlate)" stroke="#3a4250" stroke-width="2"/>
  
  <!-- Rivets at 4 corners -->
  <circle cx="10" cy="10" r="3.5" fill="#4a5568" stroke="#1a202c" stroke-width="1"/>
  <circle cx="9" cy="9" r="1.5" fill="#a0aec0"/>
  
  <circle cx="510" cy="10" r="3.5" fill="#4a5568" stroke="#1a202c" stroke-width="1"/>
  <circle cx="509" cy="9" r="1.5" fill="#a0aec0"/>
  
  <circle cx="10" cy="110" r="3.5" fill="#4a5568" stroke="#1a202c" stroke-width="1"/>
  <circle cx="9" cy="109" r="1.5" fill="#a0aec0"/>
  
  <circle cx="510" cy="110" r="3.5" fill="#4a5568" stroke="#1a202c" stroke-width="1"/>
  <circle cx="509" cy="109" r="1.5" fill="#a0aec0"/>

  <!-- Hazard strip on left edge -->
  <polygon points="15,4 32,4 32,116 15,116" fill="url(#hazardStripe)" opacity="0.85"/>
  <line x1="33" y1="4" x2="33" y2="116" stroke="#f5a623" stroke-width="2"/>

  <!-- Red oval badge for TEST DRIVE -->
  <g transform="translate(48, 14)">
    <!-- Red outer frame with distressed angle -->
    <polygon points="5,-2 175,-6 182,34 2,36" fill="none" stroke="#b71c1c" stroke-width="2" opacity="0.6"/>
    <!-- Red pill -->
    <ellipse cx="88" cy="15" rx="84" ry="16" fill="url(#redBadge)" stroke="#ff4d4d" stroke-width="1.5" filter="url(#grungeShadow)" transform="rotate(-3, 88, 15)"/>
    <text x="88" y="21" font-family="'Impact', 'Arial Black', sans-serif" font-size="19" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="1.5" filter="url(#grungeShadow)" transform="rotate(-3, 88, 15)">TEST DRIVE</text>
  </g>

  <!-- PS2 Badge in Top Right -->
  <g transform="translate(385, 12)">
    <rect x="0" y="0" width="118" height="22" rx="3" fill="#000000" stroke="#003791" stroke-width="1.5"/>
    <text x="8" y="15" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#00439c" letter-spacing="1">PS2</text>
    <line x1="36" y1="4" x2="36" y2="18" stroke="#2d3748" stroke-width="1"/>
    <text x="42" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#ffcc00" letter-spacing="0.5">SLUS_209.10</text>
  </g>

  <!-- Acid Yellow Stencil Spray: EVE OF DESTRUCTION -->
  <g transform="translate(50, 48)">
    <!-- Drop shadow grunge duplicate -->
    <text x="3" y="45" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" font-style="italic" fill="#000000" letter-spacing="2" opacity="0.9" transform="skewX(-8)">EVE OF DESTRUCTION</text>
    <!-- Front glowing yellow text -->
    <text x="0" y="42" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" font-style="italic" fill="url(#yellowSpray)" stroke="#d48800" stroke-width="1.5" letter-spacing="2" transform="skewX(-8)" filter="url(#grungeShadow)">EVE OF DESTRUCTION</text>
  </g>

  <!-- Bottom subtitle bar -->
  <g transform="translate(52, 98)">
    <rect x="0" y="0" width="450" height="15" fill="#0a0c0e" rx="2" stroke="#252b36" stroke-width="1"/>
    <text x="8" y="11" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#94a3b8" letter-spacing="1.5">RECOMPILATION &amp; REVERSE-ENGINEERING WIKI • EMOTION ENGINE &amp; GS</text>
  </g>
</svg>
