<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Weathered Steel Gradient -->
    <linearGradient id="metalChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c222c"/>
      <stop offset="40%" stop-color="#13171f"/>
      <stop offset="70%" stop-color="#181d26"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>

    <!-- Beveled Metal Border Gradient -->
    <linearGradient id="metalBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="50%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>

    <!-- Test Drive Red Oval Gradient -->
    <linearGradient id="testDriveRed" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="25%" stop-color="#e11d48"/>
      <stop offset="65%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Acid Yellow Spray Paint Gradient -->
    <linearGradient id="sprayYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffb00"/>
      <stop offset="35%" stop-color="#ffd000"/>
      <stop offset="85%" stop-color="#ff9d00"/>
      <stop offset="100%" stop-color="#e67e00"/>
    </linearGradient>

    <!-- Deep Drop Shadow Filter -->
    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <!-- Spray Overspray Glow Filter -->
    <filter id="sprayGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Rivet Specular Gradients -->
    <radialGradient id="rivetHead" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#64748b"/>
      <stop offset="90%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- 1. Base Plate: Riveted Heavy Galvanized Steel Panel -->
  <rect x="8" y="8" width="496" height="496" rx="28" fill="url(#metalChassis)" stroke="url(#metalBevel)" stroke-width="6" filter="url(#heavyShadow)"/>
  
  <!-- Subtle Industrial Inset Groove -->
  <rect x="22" y="22" width="468" height="468" rx="18" fill="none" stroke="#0a0c10" stroke-width="3" opacity="0.8"/>
  <rect x="24" y="24" width="464" height="464" rx="16" fill="none" stroke="#2a3444" stroke-width="1.5" opacity="0.6"/>

  <!-- 2. Four Heavy Bolted Corner Plates with Rivets -->
  <!-- Top Left -->
  <polygon points="12,12 70,12 70,36 36,70 12,70" fill="#202733" stroke="#374151" stroke-width="2"/>
  <circle cx="34" cy="34" r="7" fill="url(#rivetHead)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Top Right -->
  <polygon points="500,12 442,12 442,36 476,70 500,70" fill="#202733" stroke="#374151" stroke-width="2"/>
  <circle cx="478" cy="34" r="7" fill="url(#rivetHead)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="476" cy="32" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Bottom Left -->
  <polygon points="12,500 70,500 70,476 36,442 12,442" fill="#202733" stroke="#374151" stroke-width="2"/>
  <circle cx="34" cy="478" r="7" fill="url(#rivetHead)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="32" cy="476" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Bottom Right -->
  <polygon points="500,500 442,500 442,476 476,442 500,442" fill="#202733" stroke="#374151" stroke-width="2"/>
  <circle cx="478" cy="478" r="7" fill="url(#rivetHead)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="476" cy="476" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- 3. Stenciled Background Graphics (Demolition Derby Stencil Texture) -->
  <g opacity="0.12" fill="#cbd5e1">
    <text x="38" y="110" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" letter-spacing="4">FUEL FLAMMABLE</text>
    <text x="38" y="440" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" letter-spacing="6">952087</text>
    <line x1="38" y1="120" x2="474" y2="120" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8,6"/>
    <line x1="38" y1="410" x2="474" y2="410" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8,6"/>
  </g>

  <!-- 4. The Iconic Slanted Red "TEST DRIVE" Oval Badge -->
  <g transform="translate(256, 175) rotate(-6)">
    <!-- Heavy Drop Shadow Behind Badge -->
    <ellipse cx="0" cy="5" rx="192" ry="58" fill="#000000" opacity="0.9" filter="url(#heavyShadow)"/>
    
    <!-- Outer Distressed White Border -->
    <ellipse cx="0" cy="0" rx="190" ry="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    
    <!-- Dark Inner Border Frame -->
    <ellipse cx="0" cy="0" rx="182" ry="50" fill="#991b1b"/>
    
    <!-- Red Badge Core Fill -->
    <ellipse cx="0" cy="0" rx="178" ry="46" fill="url(#testDriveRed)"/>

    <!-- Shiny Specular Arc at Top of Badge -->
    <path d="M -150 -10 A 160 38 0 0 1 150 -10 A 170 42 0 0 0 -150 -10 Z" fill="#ffffff" opacity="0.25"/>

    <!-- Crisp Bold White Italic "Test Drive" Lettering -->
    <!-- Drop Shadow on Text -->
    <text x="3" y="19" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" font-style="italic" fill="#500724" text-anchor="middle" letter-spacing="1">Test Drive</text>
    <!-- Crisp White Text -->
    <text x="0" y="16" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="1">Test Drive</text>
    <!-- Registered Symbol -->
    <text x="145" y="-12" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff">®</text>
  </g>

  <!-- 5. Explosive Yellow Spray-Paint Graffiti: "EVE OF DESTRUCTION" -->
  <g transform="translate(256, 305)">
    <!-- Burnt Black / Dark Red Spray Shadow Layer (Overspray effect) -->
    <g transform="rotate(-4) skewX(-10)">
      <!-- EVE OF Drop Shadow -->
      <text x="-4" y="-30" font-family="'Permanent Marker', 'Impact', 'Arial Black', sans-serif" font-size="62" font-weight="900" fill="#090a0f" text-anchor="middle" letter-spacing="3" opacity="0.95">EVE OF</text>
      <!-- DESTRUCTION Drop Shadow -->
      <text x="-4" y="42" font-family="'Permanent Marker', 'Impact', 'Arial Black', sans-serif" font-size="58" font-weight="900" fill="#090a0f" text-anchor="middle" letter-spacing="2" opacity="0.95">DESTRUCTION</text>
      
      <!-- Signature Yellow Graffiti Checkmark / Underline Tail Shadow -->
      <path d="M 140 38 C 170 42, 210 20, 225 -25 C 220 0, 180 62, 130 52 Z" fill="#090a0f" opacity="0.9"/>
      <!-- Paint Drip Shadows -->
      <path d="M -155 52 Q -155 78 -153 82 Q -150 78 -151 52 Z" fill="#090a0f"/>
      <path d="M -20 54 Q -20 86 -17 90 Q -15 86 -16 54 Z" fill="#090a0f"/>
      <path d="M 85 54 Q 85 80 88 84 Q 90 80 89 54 Z" fill="#090a0f"/>
    </g>

    <!-- Vibrant Yellow Spray Paint Layer -->
    <g transform="rotate(-4) skewX(-10)" filter="url(#sprayGlow)">
      <!-- EVE OF -->
      <text x="0" y="-34" font-family="'Permanent Marker', 'Impact', 'Arial Black', sans-serif" font-size="62" font-weight="900" fill="url(#sprayYellow)" stroke="#c2410c" stroke-width="2.5" text-anchor="middle" letter-spacing="3">EVE OF</text>
      
      <!-- DESTRUCTION -->
      <text x="0" y="38" font-family="'Permanent Marker', 'Impact', 'Arial Black', sans-serif" font-size="58" font-weight="900" fill="url(#sprayYellow)" stroke="#c2410c" stroke-width="2.5" text-anchor="middle" letter-spacing="2">DESTRUCTION</text>

      <!-- Signature Yellow Spray Graffiti Checkmark / Underline Tail -->
      <path d="M 142 34 C 172 38, 214 16, 228 -28 C 222 -3, 182 58, 132 48 Z" fill="url(#sprayYellow)" stroke="#c2410c" stroke-width="1.5"/>
      
      <!-- Paint Drips -->
      <path d="M -154 48 Q -154 74 -152 78 Q -150 74 -151 48 Z" fill="url(#sprayYellow)"/>
      <circle cx="-152" cy="85" r="3" fill="url(#sprayYellow)"/>
      
      <path d="M -19 50 Q -19 82 -17 86 Q -15 82 -16 50 Z" fill="url(#sprayYellow)"/>
      <circle cx="-17" cy="94" r="3.5" fill="url(#sprayYellow)"/>

      <path d="M 86 50 Q 86 76 88 80 Q 90 76 89 50 Z" fill="url(#sprayYellow)"/>
      <circle cx="88" cy="88" r="2.8" fill="url(#sprayYellow)"/>
    </g>
  </g>

  <!-- 6. Bottom Stamped Plate: PS2 Native Recomp Technical Emblem -->
  <g transform="translate(64, 436)">
    <rect x="0" y="0" width="384" height="38" rx="6" fill="#0d1117" stroke="#334155" stroke-width="1.5"/>
    <!-- Small PS2 Blue Badge -->
    <rect x="6" y="6" width="46" height="26" rx="3" fill="#003791"/>
    <text x="29" y="24" font-family="'Russo One', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PS2</text>
    
    <!-- Title Text -->
    <text x="64" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#ffd000" letter-spacing="0.5">SLUS_209.10</text>
    <text x="175" y="24" font-family="'Russo One', sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1">• RECOMP WIKI</text>
  </g>
</svg>
